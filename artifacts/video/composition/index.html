<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #f7f8f5;
      }
      .scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div data-hf-id="hf-aoan"
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="100"
      data-width="1920"
      data-height="1080"
    >
      <div data-hf-id="hf-0iir"
        id="el-01-check"
        class="scene"
        data-composition-id="01-check"
        data-composition-src="compositions/frames/01-check.html"
        data-start="0"
        data-duration="25"
        data-track-index="1"
      ></div>

      <div data-hf-id="hf-q17m"
        id="el-02-source"
        class="scene"
        data-composition-id="02-source"
        data-composition-src="compositions/frames/02-source.html"

      <div data-hf-id="hf-yl28"

        class="scene"

        data-track-index="1"
      ></div>

    </div>

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
